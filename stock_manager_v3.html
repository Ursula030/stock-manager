<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>我的台股管家 v3</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#70757f;--line:#e7e9ee;
  --good:#147a42;--warn:#b56a00;--bad:#c2332b;--blue:#315fd4;--soft:#f8f9fb;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}
body{min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:14px}
.hero{padding:10px 3px 2px}
h1{font-size:28px;margin:0 0 6px}
.sub{font-size:14px;color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.025)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:12px}
.metric small{display:block;color:var(--muted);font-size:12px}
.metric strong{display:block;font-size:20px;margin-top:4px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
input,select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;font-size:16px;color:var(--text)}
button{border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:650;cursor:pointer}
.primary{background:#111827;color:#fff}.secondary{background:#eef2ff;color:#3144a6}.ghost{background:#f1f3f5;color:#34373d}.danger{background:#fff0ef;color:#a92d27}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.blue{color:var(--blue)}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.pill{display:inline-block;font-size:11px;padding:4px 8px;background:#f0f2f5;border-radius:999px;margin:2px 3px 2px 0}
.stock{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;background:white}
.stockhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stocktitle{font-weight:800;font-size:18px}.stocksub{font-size:12px;color:var(--muted);margin-top:3px}
.decision{font-weight:800;font-size:17px;margin-top:10px}
.stockgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.kpi{background:#fafafa;border:1px solid var(--line);border-radius:11px;padding:9px}
.kpi small{display:block;font-size:11px;color:var(--muted)}.kpi b{display:block;font-size:15px;margin-top:2px}
.details{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.details ul{padding-left:20px;line-height:1.6;margin:7px 0}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.empty{text-align:center;color:var(--muted);padding:20px 5px}
#addForm{display:none}
@media(max-width:820px){.stockgrid{grid-template-columns:repeat(3,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.wrap{padding:10px}.grid2,.grid3{grid-template-columns:1fr}.stockgrid{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>我的台股管家 v3</h1>
    <div class="sub">打開頁面即可更新持股、計算均線／RSI／成交量，並用固定規則給出「加碼、持有、觀察、減碼、賣出」建議。</div>
  </div>

  <div class="card">
    <div class="space">
      <strong>投資組合總覽</strong>
      <div class="row">
        <button class="secondary" onclick="refreshAll()">更新全部</button>
        <button class="primary" onclick="toggleAdd()">＋ 新增持股</button>
      </div>
    </div>
    <div id="summary" class="grid4" style="margin-top:12px">
      <div class="metric"><small>持股檔數</small><strong id="sumCount">0</strong></div>
      <div class="metric"><small>總成本</small><strong id="sumCost">—</strong></div>
      <div class="metric"><small>目前市值</small><strong id="sumValue">—</strong></div>
      <div class="metric"><small>總損益</small><strong id="sumPnl">—</strong></div>
    </div>
    <div id="globalStatus" class="status"></div>
  </div>

  <div class="card" id="addForm">
    <div class="space"><strong>新增／修改持股</strong><button class="ghost" onclick="toggleAdd()">關閉</button></div>
    <div class="grid3" style="margin-top:12px">
      <div><label>股票代號</label><input id="fTicker" inputmode="numeric" placeholder="例如 3037"></div>
      <div><label>成本價</label><input id="fCost" type="number" step="0.01" placeholder="例如 850"></div>
      <div><label>持有股數</label><input id="fQty" type="number" step="1" placeholder="例如 50"></div>
      <div><label>操作策略</label>
        <select id="fStrategy">
          <option value="short">短線</option>
          <option value="swing" selected>波段</option>
          <option value="long">中長期</option>
        </select>
      </div>
      <div><label>最大可接受虧損 %</label><input id="fMaxLoss" type="number" step="0.5" value="12"></div>
      <div><label>基本面看法</label>
        <select id="fFund">
          <option value="yes" selected>仍看好</option>
          <option value="neutral">不確定</option>
          <option value="no">已不看好</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="saveHolding()">儲存持股</button>
      <button class="ghost" onclick="resetForm()">清空</button>
    </div>
    <input type="hidden" id="editId">
  </div>

  <div class="card">
    <div class="space">
      <strong>今日持股建議</strong>
      <div class="note">點「查看原因」可展開詳細判斷</div>
    </div>
    <div id="portfolio"></div>
  </div>

  <div class="card">
    <strong>這套規則怎麼判斷</strong>
    <div class="note" style="margin-top:8px">
      系統會綜合目前損益、MA5、MA20、MA60、RSI14、成交量、你的持有策略與基本面看法。
      它刻意避免「跌很多就叫你攤平」或「一跌破就全部砍掉」；超賣但趨勢仍弱時，會優先給「觀察」。
      所有設定與持股只存在你的瀏覽器 localStorage，不會上傳到任何伺服器。
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const STORAGE='stockbot_v3_holdings';

function loadHoldings(){try{return JSON.parse(localStorage.getItem(STORAGE)||'[]')}catch(e){return[]}}
function saveHoldings(v){localStorage.setItem(STORAGE,JSON.stringify(v))}
function fmt(x){return x==null||Number.isNaN(x)?'—':Number(x).toLocaleString('zh-TW',{maximumFractionDigits:2})}
function money(x){return x==null||Number.isNaN(x)?'—':'$'+Math.round(x).toLocaleString('zh-TW')}
function pct(x){return (x>=0?'+':'')+x.toFixed(2)+'%'}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function sma(a,n){return a.length<n?null:avg(a.slice(-n))}
function rsi14(c){
  if(c.length<15)return null;let g=0,l=0;
  for(let i=c.length-14;i<c.length;i++){let d=c[i]-c[i-1];if(d>0)g+=d;else l-=d}
  const ag=g/14,al=l/14;if(al===0)return 100;const rs=ag/al;return 100-100/(1+rs)
}

function toggleAdd(){const f=$('addForm');f.style.display=f.style.display==='none'||!f.style.display?'block':'none'}
function resetForm(){
  $('fTicker').value='';$('fCost').value='';$('fQty').value='';$('fStrategy').value='swing';
  $('fMaxLoss').value='12';$('fFund').value='yes';$('editId').value='';
}
function saveHolding(){
  const ticker=$('fTicker').value.trim(),cost=Number($('fCost').value),qty=Number($('fQty').value);
  if(!/^\d{4,6}$/.test(ticker)){alert('請輸入台股代號，例如 3037。');return}
  if(!(cost>0)){alert('請輸入成本價。');return}
  if(!(qty>0)){alert('請輸入持有股數。');return}
  let h=loadHoldings(),id=$('editId').value||String(Date.now());
  const item={id,ticker,cost,qty,strategy:$('fStrategy').value,maxLoss:Number($('fMaxLoss').value)||12,fund:$('fFund').value};
  const i=h.findIndex(x=>x.id===id); if(i>=0)h[i]=item;else h.push(item);
  saveHoldings(h); resetForm(); $('addForm').style.display='none'; renderSkeleton(); refreshOne(id);
}
function editHolding(id){
  const x=loadHoldings().find(v=>v.id===id);if(!x)return;
  $('fTicker').value=x.ticker;$('fCost').value=x.cost;$('fQty').value=x.qty;$('fStrategy').value=x.strategy;
  $('fMaxLoss').value=x.maxLoss;$('fFund').value=x.fund;$('editId').value=x.id;$('addForm').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
function removeHolding(id){
  if(!confirm('確定刪除這筆持股？'))return;
  saveHoldings(loadHoldings().filter(x=>x.id!==id));renderSkeleton();updateSummary();
}

async function fetchYahoo(symbol){
  let err;
  for(const host of ['query1.finance.yahoo.com','query2.finance.yahoo.com']){
    try{
      const u=`https://${host}/v8/finance/chart/${encodeURIComponent(symbol)}?range=6mo&interval=1d&includePrePost=false&events=div%2Csplits`;
      const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json(),d=j?.chart?.result?.[0];if(!d)throw new Error('查無資料');return d;
    }catch(e){err=e}
  }
  throw err||new Error('行情來源無法連線');
}
async function getMarket(ticker){
  for(const suffix of ['.TW','.TWO']){
    try{
      const d=await fetchYahoo(ticker+suffix),q=d.indicators?.quote?.[0],ts=d.timestamp||[];
      const rows=[];
      for(let i=0;i<ts.length;i++){
        const c=q?.close?.[i],v=q?.volume?.[i];
        if(c!=null&&Number.isFinite(c))rows.push({t:ts[i],c:Number(c),v:v==null?null:Number(v)});
      }
      if(rows.length>=60)return{symbol:ticker+suffix,d,rows};
    }catch(e){}
  }
  throw new Error('找不到代號或行情來源暫時無法連線');
}

function analyze(x,m){
  const rows=m.rows,d=m.d,q=d.indicators.quote[0],meta=d.meta||{},closes=rows.map(r=>r.c);
  const last=rows[rows.length-1],price=Number.isFinite(meta.regularMarketPrice)?meta.regularMarketPrice:last.c;
  const ma5=sma(closes,5),ma20=sma(closes,20),ma60=sma(closes,60),rsi=rsi14(closes);
  const vols=rows.slice(-20).map(r=>r.v).filter(v=>v&&v>0),vavg=avg(vols),vr=last.v&&vavg?last.v/vavg:null;
  const pnl=(price-x.cost)/x.cost*100;
  let score=0,reasons=[],tags=[];

  if(pnl<=-x.maxLoss){score-=3;reasons.push(`損益 ${pct(pnl)}，已超過你設定的最大可接受虧損 ${x.maxLoss}% 。`);tags.push('觸及風控')}
  else if(pnl<=-7){score-=1;reasons.push(`目前虧損 ${pct(pnl)}，已進入偏大虧損區。`)}
  else if(pnl>=25){score-=1;reasons.push(`目前已有 ${pct(pnl)} 帳面獲利，若趨勢轉弱可分批落袋。`);tags.push('高獲利區')}
  else if(pnl>=8){score+=1;reasons.push(`目前獲利 ${pct(pnl)}，部位已有安全墊。`)}
  else reasons.push(`目前損益 ${pct(pnl)}，單看損益尚未觸發極端動作。`);

  if(price>ma5){score+=1;reasons.push('站上 MA5：短線動能偏強。')}else{score-=1;reasons.push('跌破 MA5：短線轉弱。')}
  if(price>ma20){score+=2;reasons.push('站上 MA20：波段趨勢偏多。');tags.push('月線上')}else{score-=2;reasons.push('跌破 MA20：波段趨勢偏弱。');tags.push('月線下')}
  if(price>ma60){score+=2;reasons.push('站上 MA60：中期結構仍偏多。')}else{score-=2;reasons.push('跌破 MA60：中期結構轉弱。');tags.push('季線下')}
  if(ma5>ma20&&ma20>ma60){score+=2;reasons.push('MA5 > MA20 > MA60：偏多排列。');tags.push('多頭排列')}
  if(ma5<ma20&&ma20<ma60){score-=2;reasons.push('MA5 < MA20 < MA60：偏空排列。');tags.push('空頭排列')}

  if(rsi<30){score+=1;reasons.push(`RSI14 ${rsi.toFixed(1)}：進入超賣區，殺低風險提高。`);tags.push('超賣')}
  else if(rsi>75){score-=1;reasons.push(`RSI14 ${rsi.toFixed(1)}：短線偏過熱，不宜追高。`);tags.push('過熱')}
  else reasons.push(`RSI14 ${rsi.toFixed(1)}：位於一般區間。`);

  if(vr!=null){
    if(vr>=1.5&&price>ma20){score+=1;reasons.push(`成交量約為20日均量 ${vr.toFixed(2)} 倍，且價格在月線上。`)}
    else if(vr>=1.5&&price<ma20){score-=1;reasons.push(`成交量放大至約 ${vr.toFixed(2)} 倍，但價格仍在月線下。`)}
    else reasons.push(`成交量約為20日均量 ${vr.toFixed(2)} 倍，無明顯異常放量。`);
  }

  if(x.fund==='yes'){score+=1;reasons.push('你仍看好基本面，因此不因單一技術訊號一次清倉。')}
  else if(x.fund==='neutral'){reasons.push('你對基本面不確定，因此不建議單純因為下跌就攤平。')}
  else{score-=3;reasons.push('你已不看好基本面，持有理由明顯下降。');tags.push('基本面轉差')}

  if(x.strategy==='short'){if(price<ma5)score-=1;if(price<ma20)score-=1}
  if(x.strategy==='long'&&price>ma60&&x.fund==='yes')score+=1;

  let decision,cls;
  if(score>=6){decision='✅ 可考慮分批加碼';cls='good'}
  else if(score>=2){decision='🟢 繼續持有';cls='good'}
  else if(score>=-1){decision='🟡 先觀察，不急著動';cls='warn'}
  else if(score>=-5){decision='🟠 建議分批減碼';cls='warn'}
  else{decision='🔴 建議賣出／停損';cls='bad'}

  if(rsi<30&&price<ma20&&price<ma60&&score>1){decision='🟡 超跌但趨勢仍弱，先觀察';cls='warn'}
  if(x.fund==='no'&&price<ma20){decision='🔴 建議賣出／降低部位';cls='bad'}

  return{
    price,ma5,ma20,ma60,rsi,vr,pnl,score,decision,cls,reasons,tags,
    name:meta.longName||meta.shortName||m.symbol,
    symbol:m.symbol,
    time:new Date((meta.regularMarketTime||last.t)*1000),
    value:price*x.qty,costValue:x.cost*x.qty,pnlMoney:(price-x.cost)*x.qty
  };
}

function renderSkeleton(){
  const h=loadHoldings(),box=$('portfolio');
  $('sumCount').textContent=h.length;
  if(!h.length){box.innerHTML='<div class="empty">目前沒有持股。點右上角「＋ 新增持股」開始建立自己的股票管家。</div>';updateSummary();return}
  box.innerHTML=h.map(x=>`
    <div class="stock" id="stock-${x.id}">
      <div class="stockhead">
        <div><div class="stocktitle">${x.ticker}</div><div class="stocksub">成本 ${fmt(x.cost)}｜${x.qty.toLocaleString()} 股｜${x.strategy==='short'?'短線':x.strategy==='swing'?'波段':'中長期'}</div></div>
        <div class="row"><button class="ghost" onclick="editHolding('${x.id}')">編輯</button><button class="danger" onclick="removeHolding('${x.id}')">刪除</button></div>
      </div>
      <div class="status">等待更新行情…</div>
    </div>`).join('');
  updateSummary();
}
async function refreshOne(id){
  const x=loadHoldings().find(v=>v.id===id);if(!x)return;
  const el=$('stock-'+id); if(!el)return;
  el.querySelector('.status').textContent='正在更新行情與指標…';
  try{
    const m=await getMarket(x.ticker),a=analyze(x,m);
    el.dataset.value=a.value;el.dataset.cost=a.costValue;el.dataset.pnl=a.pnlMoney;
    el.innerHTML=`
      <div class="stockhead">
        <div><div class="stocktitle">${x.ticker} ${a.name}</div><div class="stocksub">${a.symbol.endsWith('.TWO')?'上櫃':'上市'}｜行情 ${a.time.toLocaleString('zh-TW')}</div></div>
        <div class="row"><button class="ghost" onclick="editHolding('${x.id}')">編輯</button><button class="danger" onclick="removeHolding('${x.id}')">刪除</button></div>
      </div>
      <div class="decision ${a.cls}">${a.decision}</div>
      <div>${a.tags.map(t=>`<span class="pill">${t}</span>`).join('')}</div>
      <div class="stockgrid">
        <div class="kpi"><small>現價</small><b>${fmt(a.price)}</b></div>
        <div class="kpi"><small>成本</small><b>${fmt(x.cost)}</b></div>
        <div class="kpi"><small>報酬</small><b class="${a.pnl>=0?'good':'bad'}">${pct(a.pnl)}</b></div>
        <div class="kpi"><small>帳面損益</small><b class="${a.pnlMoney>=0?'good':'bad'}">${money(a.pnlMoney)}</b></div>
        <div class="kpi"><small>MA20</small><b>${fmt(a.ma20)}</b></div>
        <div class="kpi"><small>RSI14</small><b>${a.rsi.toFixed(1)}</b></div>
      </div>
      <div class="row" style="margin-top:9px">
        <button class="ghost" onclick="toggleDetails('${x.id}')">查看原因</button>
        <span class="note">規則分數 ${a.score}｜MA5 ${fmt(a.ma5)}｜MA60 ${fmt(a.ma60)}｜量比 ${a.vr==null?'—':a.vr.toFixed(2)+'×'}</span>
      </div>
      <div class="details" id="details-${x.id}">
        <ul>${a.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>
        <div class="note">此為規則式風險管理訊號，不保證獲利；重大消息、財報、處置股、除權息等情況可能讓技術指標失真。</div>
      </div>`;
    updateSummary();
  }catch(e){
    el.querySelector('.status').textContent='更新失敗：'+e.message+'。若你是直接從 iPhone「檔案」預覽，請改成用 Safari 開啟 GitHub Pages 網址。';
  }
}
function toggleDetails(id){const d=$('details-'+id);if(d)d.style.display=d.style.display==='block'?'none':'block'}
async function refreshAll(){
  const h=loadHoldings();if(!h.length){$('globalStatus').textContent='目前沒有持股。';return}
  $('globalStatus').textContent=`正在更新 ${h.length} 檔持股…`;
  for(const x of h) await refreshOne(x.id);
  $('globalStatus').textContent='全部更新完成。';
}
function updateSummary(){
  const els=[...document.querySelectorAll('.stock')];
  let value=0,cost=0,pnl=0,ok=0;
  for(const el of els){
    const v=Number(el.dataset.value),c=Number(el.dataset.cost),p=Number(el.dataset.pnl);
    if(Number.isFinite(v)&&Number.isFinite(c)&&Number.isFinite(p)){value+=v;cost+=c;pnl+=p;ok++}
  }
  const count=loadHoldings().length;$('sumCount').textContent=count;
  $('sumCost').textContent=ok?money(cost):'—';$('sumValue').textContent=ok?money(value):'—';
  $('sumPnl').textContent=ok?(pnl>=0?'+':'')+money(pnl).replace('$','$'):'—';
  $('sumPnl').className=pnl>=0?'good':'bad';
}

renderSkeleton();
setTimeout(()=>{if(loadHoldings().length)refreshAll()},300);
</script>
</body>
</html>
